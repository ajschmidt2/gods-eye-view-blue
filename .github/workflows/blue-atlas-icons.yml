name: Regenerate Blue Atlas app icons

on:
  push:
    branches:
      - brand/blue-atlas-foundation
    paths:
      - public/logo.svg
      - .github/workflows/blue-atlas-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    if: github.ref == 'refs/heads/brand/blue-atlas-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: node scripts/generate-icons.mjs
      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Blue Atlas PNG icons"
            git push
          fi
