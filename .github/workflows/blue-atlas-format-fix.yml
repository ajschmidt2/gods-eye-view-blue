name: Blue Atlas formatting repair
on:
  push:
    branches:
      - fix/aircraft-health-reliability
    paths:
      - .github/workflows/blue-atlas-format-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm run format
      - name: Commit formatting-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/data/layerState.js src/layers/weather/nwsAlerts.js src/layers/naturalEvents/index.js api/flights.js api/source-health.js
            if ! git diff --cached --quiet; then
              git commit -m "style: apply repository Prettier formatting"
              git push
            fi
          fi
